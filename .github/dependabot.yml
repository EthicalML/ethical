version: 2

# One batch, not a trickle. Routine version updates arrive as a single pull
# request per ecosystem on Wednesday mornings; security updates arrive as a
# single pull request as soon as an advisory lands.
#
# `applies-to` is load-bearing. A group without it covers version updates ONLY,
# so security updates fall back to one pull request per advisory no matter how
# the version groups are arranged. That is why every ecosystem below declares
# both an `all` and an `all-security` group.
#
# Majors stay on their own for npm: a framework bump usually needs reading and
# testing by itself, and bundling one into a batch means the whole batch fails
# or the major goes in unread.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
        update-types:
          - minor
          - patch
      all-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '06:00'
      timezone: Europe/Berlin
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
      all-security:
        applies-to: security-updates
        patterns: ['*']
