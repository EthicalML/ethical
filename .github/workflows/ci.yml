name: CI

on:
  pull_request:
    # `labeled`/`unlabeled` are here for the visual job: its enforcement is
    # chosen by the PR's labels, so applying `visual-change` or `dependencies`
    # has to be able to re-decide a run that already happened.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the gates are always read by the same browser. Bump deliberately.
  PLAYWRIGHT_VERSION: 1.62.1

jobs:
  # One cheap job decides what the rest are for, so a documentation change does
  # not build the site four times. The classification is deliberately generous:
  # a wrongly included path costs a few runner minutes, a wrongly excluded one
  # lets a real regression through, so anything ambiguous belongs in both lists.
  # `.github/workflows` is in both, since a change to the gates has to be run by
  # the gates. The visual job keeps its own narrower scope check on top of this.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Classify the change against the merge base
        id: filter
        # Explicit because the pathspec lists are deliberately word-split when
        # unquoted, which bash does and some shells do not.
        shell: bash
        env:
          # What a build, the ratchet, the motion gate and the sweep read.
          CODE_PATHS: src public scripts package.json package-lock.json astro.config.mjs tsconfig.json .tool-versions STYLES.md .github/workflows
          # What `npm run lint` and `npm run format:check` actually cover.
          LINT_PATHS: src scripts astro.config.mjs eslint.config.mjs prettier.config.mjs package.json package-lock.json tsconfig.json AGENTS.md README.md .github/workflows
        run: |
          # Anything that is not a pull request has no merge base to diff, so it
          # runs everything rather than guessing.
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'Not a pull request; running every job.'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'lint=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "$GITHUB_BASE_REF"
          base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          echo "Merge base: $base"
          git diff --name-only "$base" HEAD | sed 's/^/  /'
          for group in code lint; do
            case "$group" in
              code) paths="$CODE_PATHS" ;;
              lint) paths="$LINT_PATHS" ;;
            esac
            # shellcheck disable=SC2086
            if [ -n "$(git diff --name-only "$base" HEAD -- $paths)" ]; then
              echo "$group=true" >> "$GITHUB_OUTPUT"
            else
              echo "$group=false" >> "$GITHUB_OUTPUT"
              echo "Nothing under the $group paths changed; skipping those jobs."
            fi
          done

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run check:ratchet
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # No FORM_ENDPOINT here on purpose: PR builds run in demo mode so the
      # receiver URL never reaches fork-triggered runs. The deploy workflow
      # injects the secret for the production build.
      - run: npm run build

  # Screenshots cannot see a transition that plays in the wrong place and then
  # corrects: the landed page is correct, only the frames in between are not.
  # This gate drives real client-side navigations and asserts the arrival is a
  # single motion. It is required, and it is cheap enough to stay that way.
  motion:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          nohup npx --yes http-server dist -p 4126 --silent > /dev/null 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:4126/ && exit 0
            sleep 1
          done
          echo "the built site never came up on :4126" >&2
          exit 1
      - run: npm run verify:motion:all

  # Pixel parity against the PR's merge base. No baselines are committed — the
  # job builds and photographs both sides itself, so it cannot go stale and
  # cannot be blessed by hand. What it does with the answer depends on the
  # labels; see PARITY_MODE below.
  visual:
    needs: changes
    runs-on: ubuntu-latest
    # One definition, one leg per theme, run concurrently. Light is where a
    # theme-only regression can hide: dark is the default everyone develops in,
    # so a light-only mistake is invisible until someone flips the toggle.
    # fail-fast is off because a dark failure must not cancel the light leg —
    # that would withhold the answer the leg exists to give.
    strategy:
      fail-fast: false
      matrix:
        theme: [dark, light]
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'visual-change')
    permissions:
      contents: read
      pull-requests: write
    env:
      # `dependencies` is what Dependabot applies: a bump that moves rendering
      # must not merge silently, so it is held to zero differing pixels.
      # Everything else measures and reports without failing.
      PARITY_MODE: >-
        ${{ contains(github.event.pull_request.labels.*.name, 'dependencies') && 'enforce' || 'report' }}
      # Per theme: the comment updater matches on this marker and takes the
      # last hit, so one marker across two legs means they overwrite each other
      # and you read one theme's result believing it covers both.
      COMMENT_MARKER: '<!-- merge-base-visual-parity-${{ matrix.theme }} -->'
      # Separate ports: both legs can land on one runner, and a held port makes
      # the second sweep photograph the first build — a silently wrong pass.
      SHOT_PORT: ${{ matrix.theme == 'light' && '4127' || '4126' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Resolve the merge base and the scope
        id: scope
        run: |
          git fetch --no-tags --prune origin "$GITHUB_BASE_REF"
          base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Merge base: $base"
          changed=$(git diff --name-only "$base" HEAD -- src public package-lock.json)
          if [ -z "$changed" ]; then
            echo "Nothing rendered changed; skipping the visual sweep."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install ImageMagick and Playwright
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          # Playwright lives outside the checkout so it survives the two
          # `npm ci` runs this job performs (merge base, then head), and the
          # gates are pointed at it by PLAYWRIGHT_MODULE. `runner.temp` is not
          # a context job-level `env:` can read, so it is exported here.
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright/index.js" >> "$GITHUB_ENV"
      - name: Build the merge base
        if: steps.scope.outputs.run == 'true'
        run: |
          git checkout --detach "${{ steps.scope.outputs.base }}"
          npm ci
          npm run build
          mv dist "$RUNNER_TEMP/dist-base"
      - name: Build the head
        if: steps.scope.outputs.run == 'true'
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          npm ci
          npm run build
          mv dist "$RUNNER_TEMP/dist-head"
      # Both sides are photographed from the head's checkout, after both builds
      # exist. The merge base predates the harness that photographs it — running
      # its own `scripts/verify` would either fail outright or compare two
      # captures taken by two different procedures. One camera, two subjects.
      - name: Capture both builds
        if: steps.scope.outputs.run == 'true'
        run: |
          .github/scripts/capture-shots.sh "$RUNNER_TEMP/dist-base" "$RUNNER_TEMP/shots/base" "${{ matrix.theme }}" "$SHOT_PORT"
          .github/scripts/capture-shots.sh "$RUNNER_TEMP/dist-head" "$RUNNER_TEMP/shots/head" "${{ matrix.theme }}" "$SHOT_PORT"
      - name: Compare
        if: steps.scope.outputs.run == 'true'
        id: compare
        run: |
          mkdir -p "$RUNNER_TEMP/parity"
          for viewport in 1440 420; do
            # verify-parity exits non-zero on any difference; the verdict is
            # made from the reports, not from this exit code.
            npm run --silent verify:parity -- \
              "$RUNNER_TEMP/shots/base/$viewport" "$RUNNER_TEMP/shots/head/$viewport" \
              --out "$RUNNER_TEMP/parity/diff-$viewport" \
              > "$RUNNER_TEMP/parity/report-$viewport.json" || true
          done
      - name: Summarise
        if: steps.scope.outputs.run == 'true'
        id: summary
        run: |
          node scripts/verify/parity-summary.mjs \
            --mode "$PARITY_MODE" \
            --marker "$COMMENT_MARKER" \
            --title "Visual parity — ${{ matrix.theme == 'light' && 'light theme ☀️' || 'dark theme 🌙' }}" \
            --out "$RUNNER_TEMP/parity/comment.md" \
            --verdict "$RUNNER_TEMP/parity/verdict.txt" \
            "1440x1000=$RUNNER_TEMP/parity/report-1440.json" \
            "420x900=$RUNNER_TEMP/parity/report-420.json"
          echo "verdict=$(cat "$RUNNER_TEMP/parity/verdict.txt")" >> "$GITHUB_OUTPUT"
      - name: Post or update the PR comment
        # Fork PRs get a read-only token, so a comment is best-effort; the
        # verdict below is not.
        if: steps.scope.outputs.run == 'true' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$COMMENT_MARKER\"))] | last | .id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@"$RUNNER_TEMP/parity/comment.md" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/parity/comment.md" >/dev/null
          fi
      - name: Upload the diffs
        if: steps.scope.outputs.run == 'true' && steps.summary.outputs.verdict == 'moved'
        uses: actions/upload-artifact@v7
        with:
          name: visual-parity-diffs
          path: ${{ runner.temp }}/parity
          if-no-files-found: ignore
      - name: Verdict
        if: steps.scope.outputs.run == 'true'
        run: |
          cat "$RUNNER_TEMP/parity/comment.md" >> "$GITHUB_STEP_SUMMARY"
          verdict='${{ steps.summary.outputs.verdict }}'
          echo "Verdict: $verdict (mode: $PARITY_MODE)"
          if [ "$verdict" = "moved" ] && [ "$PARITY_MODE" = "enforce" ]; then
            echo "Labelled 'dependencies' and pixels moved against the merge base." >&2
            exit 1
          fi
