# Events scout ledger. Read and updated by the newsletter-issue events scout
# (.claude/skills/newsletter-issue/workflows/events-scout.md).
#
# `watchlist` is owner-curated; the scout proposes changes in its report but
# never edits it. Two tiers:
#   feature   - flagship: the scout proposes confirmed next editions straight
#               into src/content/events.yaml.
#   cfp-track - worth speaking at, not showcase-worthy: the scout reports CFP
#               windows and deadlines only; the event enters events.yaml only
#               once a talk is confirmed or the owner partners with it.
# `scouted` is the scout's own memory - one-off candidates and the known state
# of watchlist entries (`status: tracked`) - so nothing is researched from
# scratch again until a deadline nears, an edition passes, or the record ages
# out (~90 days); the scout maintains it freely. Seeded from the 2026-08-15 watchlist research
# (tables posted on PR #100).

watchlist:
  feature:
    - name: KubeCon + CloudNativeCon Europe
      note: 10k+ CNCF flagship; co-located Cloud Native AI + Kubeflow Day matters most
    - name: AGNTCon + MCPCon Europe
      note: Linux Foundation / Agentic AI Foundation canonical agents+MCP venue
    - name: AI Engineer Europe
      note: London; European edition of the flagship AI-engineering brand
    - name: World Summit AI Amsterdam
      note: 10k+; existing organiser relationship
    - name: WeAreDevelopers World Congress Berlin
      note: 15k+; keynoted 2024 and 2025
    - name: QCon London
      note: senior-practitioner flagship; curated programme, chair outreach over CFP
    - name: The AI Summit London
      note: 5k+, London Tech Week anchor; strong governance/exec fit
    - name: GITEX AI Europe Berlin
      note: 20k+, GITEX-backed; the Berlin mega-event
    - name: WAICF Cannes
      note: 10k+, strong governance/business mainstage
    - name: HumanX EMEA Amsterdam
      note: new 2026; US flagship's European edition, watch trajectory
    - name: RAISE Summit Paris
      note: new since 2024; Paris flagship, watch trajectory
    - name: AI Engineer World's Fair
      note: US, unique flagship - standing exception to the Europe rule
    - name: MLOps World
      note: US, unique flagship in the MLOps niche - standing exception; moved Austin to SF
  cfp-track:
    - name: FastAPI Conf
      note: official FastAPI-team event, Amsterdam; first edition invited-speakers only, watch for a real CFP
    - name: Rise of AI Berlin
      note: ~300 curated seats, German-ecosystem lineup; attend because Berlin
    - name: Accelerate Tomorrow AI Summit Berlin
      note: credible corporate speakers, one edition run; revisit tier after 2027
    - name: AI Coding Summit Berlin
      note: GitNation, mid-scale, right practitioner audience
    - name: ContainerDays Hamburg
      note: ~500-700, platform-engineering audience
    - name: code.talks Hamburg
      note: ~3,500 devs, regional flagship at best; already in events.yaml via CFP
    - name: AI Horizons Prague
      note: regional exec event
    - name: PyCon DE & PyData
      note: Europe's largest Python/AI community conf, community-scale
    - name: EuroPython
      note: Python community flagship, not an AI flagship
    - name: Regional PyCons in Central and nearby Europe
      note: Czechia, Austria, Poland, Netherlands, Belgium, France, Switzerland, Nordics
    - name: Cloud Native AI Summit Europe
      note: great topical fit, unproven first edition (Paris, Dec 2026)
    - name: NDC London
      note: solid stage, .NET-centric, thin AI coverage
    - name: Devoxx Belgium
      note: sell-out dev event; 2026 theme is agentic engineering

