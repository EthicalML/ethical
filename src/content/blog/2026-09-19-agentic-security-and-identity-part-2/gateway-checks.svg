<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The two checks the gateway mesh runs on every request: is the identity valid, and is it permitted">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
      .lngd{stroke:#55d68a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .lnbd{stroke:#c46a6a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">2.1 &#183; HOW IDENTITY FLOWS</text>
  <text class="head" x="40" y="86">Two checks <tspan class="headi">on every request</tspan></text>
  <rect class="shape" x="40" y="216" width="130" height="76" rx="4"/>
  <text class="node" x="105" y="244" text-anchor="middle">REQUEST</text>
  <text class="cap" x="105" y="264" text-anchor="middle">+ signed token</text>
  <text class="cap" x="105" y="280" text-anchor="middle">user + agent</text>
  <line class="ln" x1="170" y1="254" x2="192" y2="254" marker-end="url(#ar)"/>
  <rect class="shape" x="196" y="224" width="110" height="60" rx="4"/>
  <text class="node" x="251" y="250" text-anchor="middle">GATEWAY</text>
  <text class="cap" x="251" y="268" text-anchor="middle">mesh</text>
  <line class="ln" x1="306" y1="254" x2="334" y2="254" marker-end="url(#ar)"/>
  <path class="shape" d="M398 192 L460 254 L398 316 L336 254 z"/>
  <text class="cap" x="398" y="178" text-anchor="middle">CHECK 1</text>
  <text class="node" x="398" y="250" text-anchor="middle">VALID</text>
  <text class="node" x="398" y="268" text-anchor="middle">IDENTITY?</text>
  <line class="lng" x1="460" y1="254" x2="494" y2="254" marker-end="url(#arg)"/>
  <text class="good" x="477" y="244" text-anchor="middle">yes</text>
  <path class="shape" d="M560 192 L622 254 L560 316 L498 254 z"/>
  <text class="cap" x="560" y="178" text-anchor="middle">CHECK 2</text>
  <text class="node" x="560" y="250" text-anchor="middle">AUTHZ</text>
  <text class="node" x="560" y="268" text-anchor="middle">ALLOWED?</text>
  <line class="lng" x1="622" y1="254" x2="656" y2="254" marker-end="url(#arg)"/>
  <text class="good" x="639" y="244" text-anchor="middle">yes</text>
  <rect class="shapeg" x="660" y="226" width="160" height="56" rx="4"/>
  <text class="good" x="740" y="250" text-anchor="middle">ALLOWED</text>
  <text class="cap" x="740" y="268" text-anchor="middle">agent, tool, model</text>
  <rect class="shapeb" x="660" y="360" width="160" height="50" rx="4"/>
  <text class="bad" x="740" y="390" text-anchor="middle">DENIED</text>
  <path class="lnb" d="M398 316 C398 380 560 386 656 386" marker-end="url(#arb)"/>
  <text class="bad" x="470" y="360" text-anchor="middle">no</text>
  <path class="lnb" d="M560 316 C560 350 600 372 656 378" marker-end="url(#arb)"/>
  <text class="bad" x="740" y="350" text-anchor="middle">no / unreachable</text>
</svg>
