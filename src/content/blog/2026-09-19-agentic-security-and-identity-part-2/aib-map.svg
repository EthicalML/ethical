<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The control plane with the agent identity broker and the third-party path lit up and the internal components greyed out">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
      .lngd{stroke:#55d68a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .lnbd{stroke:#c46a6a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">5.2 &#183; ENTER THE AGENT IDENTITY BROKER</text>
  <text class="head" x="40" y="86">The third-party path, <tspan class="headi">lit up</tspan></text>
  <text class="cap" x="40" y="132" text-anchor="start">REQUEST PATH</text>
  <text class="cap" x="40" y="274" text-anchor="start">IDENTITY PROVIDERS</text>
  <text class="cap" x="40" y="424" text-anchor="start">OUT OF BAND</text>
  <rect class="shape" x="40" y="144" width="220" height="64" rx="4"/>
  <text class="node" x="150" y="172" text-anchor="middle">USERS</text>
  <text class="cap" x="150" y="192" text-anchor="middle">alice, bob, ...</text>
  <rect class="shape" x="320" y="144" width="220" height="64" rx="4"/>
  <text class="node" x="430" y="172" text-anchor="middle">GATEWAY MESH</text>
  <text class="cap" x="430" y="192" text-anchor="middle">every request</text>
  <rect class="shape" x="600" y="144" width="220" height="64" rx="4"/>
  <text class="node" x="710" y="172" text-anchor="middle">KAOS RESOURCES</text>
  <text class="cap" x="710" y="192" text-anchor="middle">agents, MCPs, models</text>
  <g opacity="0.32">
  <rect class="shape" x="40" y="286" width="220" height="64" rx="4"/>
  <text class="node" x="150" y="314" text-anchor="middle">USER AUTH</text>
  <text class="cap" x="150" y="334" text-anchor="middle">Keycloak, OIDC</text>
  </g>
  <g opacity="0.32">
  <rect class="shape" x="320" y="286" width="220" height="64" rx="4"/>
  <text class="node" x="430" y="314" text-anchor="middle">KAOS AUTHZ</text>
  <text class="cap" x="430" y="334" text-anchor="middle">user + agent access</text>
  </g>
  <g opacity="0.32">
  <rect class="shape" x="600" y="286" width="220" height="64" rx="4"/>
  <text class="node" x="710" y="314" text-anchor="middle">AGENT AUTH</text>
  <text class="cap" x="710" y="334" text-anchor="middle">ServiceAccount, OIDC</text>
  </g>
  <g opacity="0.32">
  <rect class="shape" x="40" y="436" width="220" height="64" rx="4"/>
  <text class="node" x="150" y="464" text-anchor="middle">KAOS OPERATOR</text>
  <text class="cap" x="150" y="484" text-anchor="middle">syncs identity + grants</text>
  </g>
  <rect class="shapeg" x="320" y="436" width="220" height="64" rx="4"/>
  <text class="good" x="430" y="464" text-anchor="middle">IDENTITY BROKER</text>
  <text class="cap" x="430" y="484" text-anchor="middle">Agentic Identity Broker</text>
  <rect class="shapeg" x="600" y="436" width="220" height="64" rx="4"/>
  <text class="good" x="710" y="464" text-anchor="middle">3RD-PARTY SERVICE</text>
  <text class="cap" x="710" y="484" text-anchor="middle">GitHub, ...</text>
  <g opacity="0.32">
  <line class="ln" x1="710" y1="282" x2="710" y2="212" marker-end="url(#ar)"/>
  <line class="ln" x1="150" y1="282" x2="150" y2="212" marker-end="url(#ar)"/>
  <line class="ln" x1="430" y1="212" x2="430" y2="282" marker-end="url(#ar)"/>
  <line class="ln" x1="316" y1="318" x2="264" y2="318" marker-end="url(#ar)"/>
  <line class="ln" x1="544" y1="318" x2="596" y2="318" marker-end="url(#ar)"/>
  </g>
  <line class="lng" x1="260" y1="176" x2="316" y2="176" marker-end="url(#arg)"/>
  <line class="lng" x1="540" y1="176" x2="596" y2="176" marker-end="url(#arg)"/>
  <path class="lng" d="M530 208 C558 248 558 396 530 434" marker-end="url(#arg)"/>
  <line class="lng" x1="600" y1="468" x2="544" y2="468" marker-end="url(#arg)"/>
  <path class="lngd" d="M710 500 V526 H24 V176 H36" marker-end="url(#arg)"/>
  <circle cx="732" cy="247" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="732" y="251" text-anchor="middle">0</text>
  <circle cx="172" cy="247" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="172" y="251" text-anchor="middle">1</text>
  <circle cx="290" cy="176" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="290" y="180" text-anchor="middle">2</text>
  <circle cx="570" cy="176" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="570" y="180" text-anchor="middle">10</text>
  <circle cx="452" cy="247" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="452" y="251" text-anchor="middle">4</text>
  <circle cx="290" cy="318" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="290" y="322" text-anchor="middle">5</text>
  <circle cx="586" cy="296" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="586" y="300" text-anchor="middle">6</text>
  <circle cx="570" cy="413" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="570" y="417" text-anchor="middle">7</text>
  <circle cx="570" cy="468" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="570" y="472" text-anchor="middle">8</text>
  <circle cx="430" cy="526" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="430" y="530" text-anchor="middle">9</text>
  <circle cx="50" cy="566" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="50" y="570" text-anchor="middle">0</text>
  <text class="cap" x="70" y="570" text-anchor="start">agent auth provides agent identity</text>
  <circle cx="50" cy="590" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="50" y="594" text-anchor="middle">1</text>
  <text class="cap" x="70" y="594" text-anchor="start">user auth authenticates the user</text>
  <circle cx="50" cy="614" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="50" y="618" text-anchor="middle">2</text>
  <text class="cap" x="70" y="618" text-anchor="start">the user sends a request</text>
  <circle cx="50" cy="638" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="50" y="642" text-anchor="middle">4</text>
  <text class="cap" x="70" y="642" text-anchor="start">gateway checks user + agent access</text>
  <circle cx="50" cy="662" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="50" y="666" text-anchor="middle">5</text>
  <text class="cap" x="70" y="666" text-anchor="start">authz verifies the user</text>
  <circle cx="470" cy="566" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="470" y="570" text-anchor="middle">6</text>
  <text class="cap" x="490" y="570" text-anchor="start">authz verifies the agent</text>
  <circle cx="470" cy="590" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="470" y="594" text-anchor="middle">7</text>
  <text class="cap" x="490" y="594" text-anchor="start">gateway asks for third-party access</text>
  <circle cx="470" cy="614" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="470" y="618" text-anchor="middle">8</text>
  <text class="cap" x="490" y="618" text-anchor="start">the service grants a token</text>
  <circle cx="470" cy="638" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="470" y="642" text-anchor="middle">9</text>
  <text class="cap" x="490" y="642" text-anchor="start">the user consents, once</text>
  <circle cx="470" cy="662" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="470" y="666" text-anchor="middle">10</text>
  <text class="cap" x="490" y="666" text-anchor="start">gateway routes the request</text>
</svg>
