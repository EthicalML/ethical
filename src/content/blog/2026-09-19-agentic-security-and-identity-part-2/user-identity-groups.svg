<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The Keycloak realm with alice in researchers and bob in support, and the group claim that the gateway reads">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
      .lngd{stroke:#55d68a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .lnbd{stroke:#c46a6a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">4.2 &#183; USER IDENTITY</text>
  <text class="head" x="40" y="86">Groups ride along <tspan class="headi">as a claim</tspan></text>
  <path class="dash" d="M40 130 h220 v260 h-220 z"/>
  <text class="good" x="56" y="152" text-anchor="start">KEYCLOAK REALM: kaos</text>
  <rect class="shape" x="60" y="172" width="180" height="64" rx="4"/>
  <text class="node" x="150" y="198" text-anchor="middle">USERS</text>
  <text class="cap" x="150" y="218" text-anchor="middle">alice, bob</text>
  <rect class="shape" x="60" y="300" width="180" height="64" rx="4"/>
  <text class="node" x="150" y="326" text-anchor="middle">GROUPS</text>
  <text class="cap" x="150" y="346" text-anchor="middle">researchers, support</text>
  <rect class="shapeg" x="350" y="220" width="200" height="90" rx="4"/>
  <text class="good" x="450" y="248" text-anchor="middle">SIGNED TOKEN</text>
  <text class="node" x="450" y="272" text-anchor="middle">sub=alice</text>
  <text class="node" x="450" y="292" text-anchor="middle">groups=[researchers]</text>
  <line class="ln" x1="240" y1="204" x2="346" y2="244" marker-end="url(#ar)"/>
  <text class="cap" x="266" y="200" text-anchor="start">kaos auth login</text>
  <path class="lngd" d="M240 332 L346 288" marker-end="url(#arg)"/>
  <text class="good" x="266" y="350" text-anchor="start">stamped</text>
  <text class="good" x="266" y="366" text-anchor="start">as a claim</text>
  <line class="ln" x1="550" y1="265" x2="656" y2="265" marker-end="url(#ar)"/>
  <text class="cap" x="603" y="242" text-anchor="middle">sent with</text>
  <text class="cap" x="603" y="256" text-anchor="middle">every request</text>
  <rect class="shape" x="660" y="230" width="170" height="70" rx="4"/>
  <text class="node" x="745" y="256" text-anchor="middle">GATEWAY MESH</text>
  <text class="cap" x="745" y="276" text-anchor="middle">reads the</text>
  <text class="cap" x="745" y="292" text-anchor="middle">groups claim</text>
</svg>
