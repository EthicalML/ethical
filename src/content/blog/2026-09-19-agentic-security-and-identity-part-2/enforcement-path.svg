<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The enforcement path: the gateway asking the KAOS authz service who is calling and what they want, and denying when it cannot answer">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
      .lngd{stroke:#55d68a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .lnbd{stroke:#c46a6a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">4.3 &#183; ACCESS CONTROL</text>
  <text class="head" x="40" y="86">Ask, check, <tspan class="headi">deny when unsure</tspan></text>
  <text class="node" x="40" y="250" text-anchor="start">ALICE</text>
  <text class="cap" x="40" y="268" text-anchor="start">or an agent</text>
  <line class="ln" x1="104" y1="254" x2="166" y2="254" marker-end="url(#ar)"/>
  <text class="cap" x="135" y="244" text-anchor="middle">request</text>
  <rect class="shape" x="170" y="224" width="140" height="60" rx="4"/>
  <text class="node" x="240" y="250" text-anchor="middle">GATEWAY</text>
  <text class="cap" x="240" y="268" text-anchor="middle">mesh</text>
  <line class="ln" x1="310" y1="236" x2="416" y2="194" marker-end="url(#ar)"/>
  <text class="cap" x="350" y="204" text-anchor="middle">who + what</text>
  <rect class="shapeg" x="420" y="150" width="160" height="60" rx="4"/>
  <text class="good" x="500" y="176" text-anchor="middle">KAOS AUTHZ</text>
  <text class="cap" x="500" y="194" text-anchor="middle">service</text>
  <line class="lng" x1="430" y1="210" x2="314" y2="258" marker-end="url(#arg)"/>
  <text class="good" x="386" y="250" text-anchor="middle">allow</text>
  <line class="ln" x1="580" y1="180" x2="676" y2="180" marker-end="url(#ar)"/>
  <text class="cap" x="628" y="166" text-anchor="middle">check rules</text>
  <path class="shape" d="M682 150 v56 a70 10 0 0 0 140 0 v-56"/><ellipse class="shape" cx="752" cy="150" rx="70" ry="10"/>
  <text class="node" x="752" y="190" text-anchor="middle">ACCESSGRANTS</text>
  <text class="cap" x="752" y="208" text-anchor="middle">you declared</text>
  <line class="lnbd" x1="560" y1="210" x2="666" y2="272" marker-end="url(#arb)"/>
  <rect class="shapeb" x="670" y="250" width="140" height="46" rx="4"/>
  <text class="bad" x="740" y="278" text-anchor="middle">DENIED</text>
  <text class="bad" x="740" y="316" text-anchor="middle">deny or unreachable</text>
  <path class="lng" d="M240 284 C240 350 330 370 416 370" marker-end="url(#arg)"/>
  <rect class="shape" x="420" y="340" width="300" height="60" rx="4"/>
  <text class="node" x="570" y="366" text-anchor="middle">TARGET</text>
  <text class="cap" x="570" y="384" text-anchor="middle">researcher, echo-mcp, model-api</text>
</svg>
