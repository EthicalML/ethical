<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The walkthrough topology: alice and bob, the researcher and autobot agents, the echo-mcp tool, the model endpoint and GitHub">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
      .lngd{stroke:#55d68a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .lnbd{stroke:#c46a6a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">2 &#183; THE DATA PLANE</text>
  <text class="head" x="40" y="86">Two people, two agents, <tspan class="headi">a tool and a model</tspan></text>
  <circle class="shape" cx="80" cy="168" r="10"/><path class="shape" d="M64 196 a16 17 0 0 1 32 0"/>
  <text class="node" x="110" y="172" text-anchor="start">alice</text>
  <text class="cap" x="110" y="190" text-anchor="start">group: researchers</text>
  <circle class="shape" cx="80" cy="308" r="10"/><path class="shape" d="M64 336 a16 17 0 0 1 32 0"/>
  <text class="node" x="110" y="312" text-anchor="start">bob</text>
  <text class="cap" x="110" y="330" text-anchor="start">group: support</text>
  <path class="shape" d="M420 192 l32 18 v36 l-32 18 -32-18 v-36 z"/><circle class="shape" cx="420" cy="228" r="7"/>
  <text class="node" x="420" y="286" text-anchor="middle">RESEARCHER</text>
  <text class="cap" x="420" y="304" text-anchor="middle">agent</text>
  <path class="shape" d="M420 356 l32 18 v36 l-32 18 -32-18 v-36 z"/><circle class="shape" cx="420" cy="392" r="7"/>
  <text class="node" x="420" y="450" text-anchor="middle">AUTOBOT</text>
  <text class="cap" x="420" y="468" text-anchor="middle">autonomous agent</text>
  <rect class="shape" x="640" y="150" width="170" height="60" rx="4"/>
  <text class="node" x="725" y="176" text-anchor="middle">ECHO-MCP</text>
  <text class="cap" x="725" y="194" text-anchor="middle">tool</text>
  <rect class="shape" x="640" y="330" width="170" height="60" rx="4"/>
  <text class="node" x="725" y="356" text-anchor="middle">MODEL-API</text>
  <text class="cap" x="725" y="374" text-anchor="middle">model</text>
  <line class="lng" x1="256" y1="176" x2="380" y2="214" marker-end="url(#arg)"/>
  <text class="good" x="262" y="164" text-anchor="start">has access</text>
  <line class="lnbd" x1="256" y1="316" x2="380" y2="242" marker-end="url(#arb)"/>
  <text class="bad" x="262" y="338" text-anchor="start">no access</text>
  <line class="lng" x1="458" y1="214" x2="636" y2="184" marker-end="url(#arg)"/>
  <text class="good" x="547" y="172" text-anchor="middle">has access</text>
  <line class="lng" x1="458" y1="242" x2="636" y2="350" marker-end="url(#arg)"/>
  <text class="good" x="604" y="292" text-anchor="start">has access</text>
  <line class="lng" x1="458" y1="392" x2="636" y2="368" marker-end="url(#arg)"/>
  <text class="good" x="547" y="404" text-anchor="middle">has access</text>
</svg>
