<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The consent flow: a first refused request, alice approving once, the broker storing her token, and subsequent calls going out as alice">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
      .lngd{stroke:#55d68a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .lnbd{stroke:#c46a6a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">5.4 &#183; THE REQUEST AND CONSENT FLOW</text>
  <text class="head" x="40" y="86">Refused once, <tspan class="headi">then allowed as alice</tspan></text>
  <rect class="shapeb" x="40" y="130" width="250" height="170" rx="4"/>
  <circle cx="165" cy="156" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="165" y="160" text-anchor="middle">1</text>
  <text class="node" x="165" y="196" text-anchor="middle">kaos agent invoke</text>
  <text class="node" x="165" y="216" text-anchor="middle">researcher --user alice</text>
  <text class="bad" x="165" y="256" text-anchor="middle">refused: needs approval,</text>
  <text class="bad" x="165" y="274" text-anchor="middle">no token on file</text>
  <line class="ln" x1="290" y1="215" x2="311" y2="215" marker-end="url(#ar)"/>
  <rect class="shape" x="315" y="130" width="250" height="170" rx="4"/>
  <circle cx="440" cy="156" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="440" y="160" text-anchor="middle">2</text>
  <text class="node" x="440" y="196" text-anchor="middle">kaos auth connect</text>
  <text class="node" x="440" y="216" text-anchor="middle">github --user alice</text>
  <text class="cap" x="440" y="256" text-anchor="middle">alice consents on GitHub;</text>
  <text class="cap" x="440" y="274" text-anchor="middle">the AIB stores her token</text>
  <line class="ln" x1="565" y1="215" x2="586" y2="215" marker-end="url(#ar)"/>
  <rect class="shapeg" x="590" y="130" width="250" height="170" rx="4"/>
  <circle cx="715" cy="156" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="715" y="160" text-anchor="middle">3</text>
  <text class="node" x="715" y="196" text-anchor="middle">retry the invoke</text>
  <text class="good" x="715" y="256" text-anchor="middle">allowed, acting as alice</text>
  <text class="good" x="715" y="274" text-anchor="middle">on GitHub</text>
</svg>
