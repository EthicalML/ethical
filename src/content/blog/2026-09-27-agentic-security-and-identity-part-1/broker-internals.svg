<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="Inside the broker: an end-user API for consent and OAuth, an internal admin API, the grant model, and the encrypted vault behind both">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .title{font-family:Georgia,"Times New Roman",serif;font-size:19px;fill:#f2f2f0}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">INSIDE THE BROKER</text>
  <text class="head" x="40" y="86">A vault, a grant model, <tspan class="headi">and two doors</tspan></text>
  <path class="dash" d="M300 130 h550 v330 h-550 z"/>
  <text class="good" x="318" y="152" text-anchor="start">AGENTIC IDENTITY BROKER</text>
  <text class="node" x="40" y="196" text-anchor="start">A PERSON</text>
  <line class="ln" x1="120" y1="192" x2="316" y2="210" marker-end="url(#ar)"/>
  <text class="cap" x="212" y="184" text-anchor="middle">grants and revokes</text>
  <text class="node" x="40" y="262" text-anchor="start">THE GATEWAY</text>
  <line class="ln" x1="140" y1="258" x2="316" y2="244" marker-end="url(#ar)"/>
  <text class="cap" x="226" y="236" text-anchor="middle">RFC 8693 exchange</text>
  <text class="node" x="40" y="392" text-anchor="start">PLATFORM OPERATOR</text>
  <line class="ln" x1="190" y1="388" x2="316" y2="382" marker-end="url(#ar)"/>
  <text class="cap" x="236" y="372" text-anchor="middle">stays internal</text>
  <rect class="shapeg" x="320" y="180" width="200" height="90" rx="4"/>
  <text class="good" x="420" y="206" text-anchor="middle">END-USER API</text>
  <text class="cap" x="420" y="228" text-anchor="middle">consent, OAuth2,</text>
  <text class="cap" x="420" y="246" text-anchor="middle">JWKS, the consent UI</text>
  <rect class="shape" x="320" y="336" width="200" height="90" rx="4"/>
  <text class="node" x="420" y="362" text-anchor="middle">ADMIN API</text>
  <text class="cap" x="420" y="384" text-anchor="middle">agents, services,</text>
  <text class="cap" x="420" y="402" text-anchor="middle">permission sets, keys</text>
  <line class="ln" x1="520" y1="240" x2="550" y2="270"/>
  <line class="ln" x1="520" y1="366" x2="550" y2="332"/>
  <rect class="shape" x="552" y="256" width="172" height="90" rx="4"/>
  <text class="node" x="638" y="282" text-anchor="middle">GRANT MODEL</text>
  <text class="cap" x="638" y="302" text-anchor="middle">principal, agent,</text>
  <text class="cap" x="638" y="318" text-anchor="middle">service, permission</text>
  <text class="cap" x="638" y="334" text-anchor="middle">set, grant</text>
  <line class="ln" x1="724" y1="301" x2="744" y2="301"/>
  <path class="shape" d="M744 262 v72 a46 10 0 0 0 92 0 v-72"/><ellipse class="shape" cx="790" cy="262" rx="46" ry="10"/>
  <text class="node" x="790" y="306" text-anchor="middle">VAULT</text>
  <text class="cap" x="774" y="368" text-anchor="middle">encrypted</text>
  <text class="cap" x="774" y="384" text-anchor="middle">provider tokens</text>
</svg>
