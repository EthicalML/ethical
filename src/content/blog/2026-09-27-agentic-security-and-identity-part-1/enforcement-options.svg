<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The 3 enforcement topologies compared: checks in the agent runtime, a sidecar per workload, and one gateway with a NetworkPolicy behind it">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .title{font-family:Georgia,"Times New Roman",serif;font-size:19px;fill:#f2f2f0}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">DECISION 1 &#183; ENFORCEMENT AT THE GATEWAY</text>
  <text class="head" x="40" y="86">Three places to check, <tspan class="headi">one we chose</tspan></text>
  <text class="bad" x="40" y="168" text-anchor="start">IN THE AGENT RUNTIME</text>
  <text class="cap" x="40" y="186" text-anchor="start">rejected</text>
  <rect class="shape" x="330" y="146" width="130" height="52" rx="4"/>
  <text class="node" x="395" y="168" text-anchor="middle">AGENT</text>
  <text class="cap" x="395" y="186" text-anchor="middle">checks itself</text>
  <line class="ln" x1="460" y1="172" x2="620" y2="172" marker-end="url(#ar)"/>
  <rect class="shape" x="624" y="150" width="130" height="44" rx="4"/>
  <text class="node" x="689" y="177" text-anchor="middle">RESOURCE</text>
  <line class="lnd" x1="40" y1="226" x2="820" y2="226"/>
  <text class="bad" x="40" y="276" text-anchor="start">A SIDECAR PER WORKLOAD</text>
  <text class="cap" x="40" y="294" text-anchor="start">rejected</text>
  <rect class="shape" x="330" y="258" width="110" height="44" rx="4"/>
  <text class="node" x="385" y="285" text-anchor="middle">AGENT</text>
  <line class="ln" x1="440" y1="280" x2="486" y2="280" marker-end="url(#ar)"/>
  <rect class="shape" x="490" y="254" width="120" height="52" rx="4"/>
  <text class="node" x="550" y="276" text-anchor="middle">SIDECAR</text>
  <text class="cap" x="550" y="294" text-anchor="middle">checks</text>
  <line class="ln" x1="610" y1="280" x2="650" y2="280" marker-end="url(#ar)"/>
  <rect class="shape" x="654" y="258" width="130" height="44" rx="4"/>
  <text class="node" x="719" y="285" text-anchor="middle">RESOURCE</text>
  <line class="lnd" x1="40" y1="334" x2="820" y2="334"/>
  <text class="good" x="40" y="382" text-anchor="start">ONE GATEWAY</text>
  <text class="cap" x="40" y="400" text-anchor="start">plus a NetworkPolicy, chosen</text>
  <rect class="shape" x="330" y="364" width="110" height="44" rx="4"/>
  <text class="node" x="385" y="391" text-anchor="middle">AGENT</text>
  <line class="lng" x1="440" y1="386" x2="486" y2="386" marker-end="url(#arg)"/>
  <rect class="shapeg" x="490" y="360" width="120" height="52" rx="4"/>
  <text class="good" x="550" y="382" text-anchor="middle">GATEWAY</text>
  <text class="cap" x="550" y="400" text-anchor="middle">checks</text>
  <line class="lng" x1="610" y1="386" x2="650" y2="386" marker-end="url(#arg)"/>
  <rect class="shape" x="654" y="364" width="130" height="44" rx="4"/>
  <text class="node" x="719" y="391" text-anchor="middle">RESOURCE</text>
  <path class="lnb" d="M385 408 C385 452 719 452 719 412"/>
  <path class="lnb" d="M545 434 l12 12 M557 434 l-12 12"/>
  <text class="bad" x="551" y="470" text-anchor="middle">NetworkPolicy blocks this</text>
</svg>
