<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The agent holds only its own identity, the gateway asks the broker for the stored credential, and the request goes out as the user">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .title{font-family:Georgia,"Times New Roman",serif;font-size:19px;fill:#f2f2f0}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">WHERE THE BROKER SITS</text>
  <text class="head" x="40" y="86">The agent never holds <tspan class="headi">alice's token</tspan></text>
  <path class="shape" d="M90 294 l32 18 v36 l-32 18 -32-18 v-36 z"/><circle class="shape" cx="90" cy="330" r="7"/>
  <text class="node" x="90" y="392" text-anchor="middle">AGENT</text>
  <text class="cap" x="90" y="410" text-anchor="middle">holds only its own</text>
  <text class="cap" x="90" y="426" text-anchor="middle">short-lived identity</text>
  <line class="ln" x1="130" y1="330" x2="250" y2="330" marker-end="url(#ar)"/>
  <rect class="shape" x="254" y="296" width="150" height="68" rx="4"/>
  <text class="node" x="329" y="324" text-anchor="middle">GATEWAY</text>
  <text class="cap" x="329" y="344" text-anchor="middle">the only path out</text>
  <rect class="shape" x="254" y="140" width="150" height="72" rx="4"/>
  <text class="node" x="329" y="166" text-anchor="middle">CONSENT UI</text>
  <text class="cap" x="329" y="186" text-anchor="middle">alice grants</text>
  <text class="cap" x="329" y="202" text-anchor="middle">and revokes here</text>
  <line class="ln" x1="404" y1="176" x2="486" y2="200" marker-end="url(#ar)"/>
  <rect class="shapeg" x="490" y="178" width="200" height="68" rx="4"/>
  <text class="good" x="590" y="206" text-anchor="middle">BROKER</text>
  <text class="cap" x="590" y="226" text-anchor="middle">Agentic Identity Broker</text>
  <line class="ln" x1="690" y1="212" x2="724" y2="212"/>
  <path class="shape" d="M724 176 v70 a58 10 0 0 0 116 0 v-70"/><ellipse class="shape" cx="782" cy="176" rx="58" ry="10"/>
  <text class="node" x="782" y="208" text-anchor="middle">VAULT</text>
  <text class="cap" x="782" y="226" text-anchor="middle">alice's real</text>
  <text class="cap" x="782" y="242" text-anchor="middle">GitHub token</text>
  <line class="lng" x1="392" y1="296" x2="500" y2="250" marker-end="url(#arg)"/>
  <line class="ln" x1="610" y1="246" x2="412" y2="322" marker-end="url(#ar)"/>
  <rect class="shapeg" x="560" y="326" width="170" height="60" rx="4"/>
  <text class="good" x="645" y="352" text-anchor="middle">GITHUB</text>
  <text class="node" x="645" y="372" text-anchor="middle">sees: alice</text>
  <line class="lng" x1="404" y1="352" x2="556" y2="356" marker-end="url(#arg)"/>
  <circle cx="190" cy="330" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="190" y="334" text-anchor="middle">1</text>
  <circle cx="426" cy="281" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="426" y="285" text-anchor="middle">2</text>
  <circle cx="511" cy="284" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="511" y="288" text-anchor="middle">3</text>
  <circle cx="480" cy="354" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="480" y="358" text-anchor="middle">4</text>
  <circle cx="50" cy="466" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="50" y="470" text-anchor="middle">1</text>
  <text class="cap" x="70" y="470" text-anchor="start">call, with user and agent identities</text>
  <circle cx="470" cy="466" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="470" y="470" text-anchor="middle">2</text>
  <text class="cap" x="490" y="470" text-anchor="start">prove both, ask for the credential</text>
  <circle cx="50" cy="492" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="50" y="496" text-anchor="middle">3</text>
  <text class="cap" x="70" y="496" text-anchor="start">alice's token comes back</text>
  <circle cx="470" cy="492" r="10" fill="#0f1115" stroke="#55d68a" stroke-width="1.4"/>
  <text class="good" x="470" y="496" text-anchor="middle">4</text>
  <text class="cap" x="490" y="496" text-anchor="start">request goes out as alice</text>
</svg>
