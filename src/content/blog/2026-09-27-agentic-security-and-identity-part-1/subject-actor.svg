<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The subject stays the same human across a chain of agents while the actor changes at every hop">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .title{font-family:Georgia,"Times New Roman",serif;font-size:19px;fill:#f2f2f0}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">THE SUBJECT AND THE ACTOR</text>
  <text class="head" x="40" y="86">One human, <tspan class="headi">a new actor at every hop</tspan></text>
  <text class="good" x="40" y="142" text-anchor="start">SUBJECT (user token): alice, the whole way</text>
  <line class="lng" x1="40" y1="154" x2="730" y2="154"/>
  <circle class="shape" cx="90" cy="220" r="10"/><path class="shape" d="M74 248 a16 17 0 0 1 32 0"/>
  <text class="node" x="90" y="286" text-anchor="middle">ALICE</text>
  <line class="ln" x1="124" y1="228" x2="214" y2="228" marker-end="url(#ar)"/>
  <path class="shape" d="M260 192 l32 18 v36 l-32 18 -32-18 v-36 z"/><circle class="shape" cx="260" cy="228" r="7"/>
  <text class="node" x="260" y="286" text-anchor="middle">RESEARCHER</text>
  <text class="cap" x="260" y="304" text-anchor="middle">agent</text>
  <line class="ln" x1="300" y1="228" x2="404" y2="228" marker-end="url(#ar)"/>
  <path class="shape" d="M450 192 l32 18 v36 l-32 18 -32-18 v-36 z"/><circle class="shape" cx="450" cy="228" r="7"/>
  <text class="node" x="450" y="286" text-anchor="middle">SUMMARISER</text>
  <text class="cap" x="450" y="304" text-anchor="middle">agent</text>
  <line class="ln" x1="490" y1="228" x2="596" y2="228" marker-end="url(#ar)"/>
  <rect class="shapeg" x="600" y="198" width="130" height="60" rx="4"/>
  <text class="good" x="665" y="233" text-anchor="middle">TOOL</text>
  <line class="ln" x1="210" y1="338" x2="396" y2="338"/>
  <text class="node" x="303" y="360" text-anchor="middle">actor: researcher</text>
  <line class="ln" x1="404" y1="338" x2="590" y2="338"/>
  <text class="node" x="497" y="360" text-anchor="middle">actor: summariser</text>
  <text class="cap" x="40" y="342" text-anchor="start">ACTOR (agent token)</text>
  <text class="good" x="40" y="410" text-anchor="start">third-party delegation</text>
  <text class="cap" x="236" y="410" text-anchor="start">is decided on the SUBJECT</text>
  <text class="good" x="40" y="432" text-anchor="start">resource access</text>
  <text class="cap" x="236" y="432" text-anchor="start">is decided on the ACTOR of this hop</text>
</svg>
