d the exchange</i></p></span></div></foreignObject></g></g><g class="node default kp" id="my-svg-flowchart-K-1" data-look="classic" transform="translate(542.953125, 95)"><rect class="basic label-container" style="fill:#2b281a !important;stroke:#a09050 !important" x="-167.609375" y="-87" width="335.21875" height="174"/><g class="label" style="color:#e0e0e0 !important" transform="translate(-137.609375, -72)"><rect/><foreignObject width="275.21875" height="144"><div style="color: rgb(224, 224, 224) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 620px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#e0e0e0 !important" class="nodeLabel"><p><b>KEPT</b><br />because the broker does not do it<br /><br /><b>Keycloak</b><br /><i>who the human is and their groups,<br />plus each agent as its own OIDC client</i></p></span></div></foreignObject></g></g><g class="node default bl" id="my-svg-flowchart-B-2" data-look="classic" transform="translate(927.453125, 95)"><rect class="basic label-container" style="fill:#1b2e23 !important;stroke:#50a078 !important" x="-166.890625" y="-87" width="333.78125" height="174"/><g class="label" style="color:#e0e0e0 !important" transform="translate(-136.890625, -72)"><rect/><foreignObject width="273.78125" height="144"><div style="color: rgb(224, 224, 224) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 620px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#e0e0e0 !important" class="nodeLabel"><p><b>BUILT</b><br />because it asks about our own objects<br /><br /><b>Our policy decision point</b><br /><i>may this agent reach that resource,<br />and the operator projection behind it</i></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#FFFFFF"/></filter></defs><defs><filter id="m