<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="What was adopted, what was kept, and what was built">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .title{font-family:Georgia,"Times New Roman",serif;font-size:19px;fill:#f2f2f0}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">BUILD, ADOPT OR WRAP</text>
  <text class="head" x="40" y="86">Adopted, kept, <tspan class="headi">and built</tspan></text>
  <rect class="shape" x="40" y="130" width="250" height="250" rx="4"/>
  <text class="eyebrow" x="165" y="164" text-anchor="middle">ADOPTED</text>
  <text class="cap" x="165" y="188" text-anchor="middle">because we did not</text>
  <text class="cap" x="165" y="205" text-anchor="middle">want to write it</text>
  <text class="title" x="165" y="248" text-anchor="middle">Agentic Identity</text>
  <text class="title" x="165" y="272" text-anchor="middle">Broker</text>
  <text class="cap" x="165" y="310" text-anchor="middle">the credential vault,</text>
  <text class="cap" x="165" y="327" text-anchor="middle">consent, and the exchange</text>
  <rect class="shape" x="305" y="130" width="250" height="250" rx="4"/>
  <text class="eyebrow" x="430" y="164" text-anchor="middle">KEPT</text>
  <text class="cap" x="430" y="188" text-anchor="middle">because the broker</text>
  <text class="cap" x="430" y="205" text-anchor="middle">does not do it</text>
  <text class="title" x="430" y="248" text-anchor="middle">Keycloak</text>
  <text class="cap" x="430" y="310" text-anchor="middle">who the human is and</text>
  <text class="cap" x="430" y="327" text-anchor="middle">their groups, plus each</text>
  <text class="cap" x="430" y="344" text-anchor="middle">agent as an OIDC client</text>
  <rect class="shapeg" x="570" y="130" width="250" height="250" rx="4"/>
  <text class="eyebrow" x="695" y="164" text-anchor="middle">BUILT</text>
  <text class="cap" x="695" y="188" text-anchor="middle">because it asks about</text>
  <text class="cap" x="695" y="205" text-anchor="middle">our own objects</text>
  <text class="title" x="695" y="248" text-anchor="middle">Our policy</text>
  <text class="title" x="695" y="272" text-anchor="middle">decision point</text>
  <text class="cap" x="695" y="310" text-anchor="middle">may this agent reach</text>
  <text class="cap" x="695" y="327" text-anchor="middle">that resource, and the</text>
  <text class="cap" x="695" y="344" text-anchor="middle">operator projection</text>
  <text class="cap" x="695" y="361" text-anchor="middle">behind it</text>
</svg>
