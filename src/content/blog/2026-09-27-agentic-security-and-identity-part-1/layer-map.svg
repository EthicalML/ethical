<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The layers of the agent identity stack, from workload identity at the bottom through brokering and enforcement to policy at the top; the top two enforce, the bottom three establish identity">
    <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">THE AGENT IDENTITY STACK</text>
  <text class="head" x="40" y="86">Five layers, <tspan class="headi">one you can't skip</tspan></text>
  <rect class="shape" x="40" y="130" width="600" height="64" rx="4"/>
  <text class="node" x="60" y="157">POLICY</text>
  <text class="cap" x="250" y="157">evaluates the rules</text>
  <text class="cap" x="60" y="179">Open Policy Agent</text>
  <rect class="shape" x="40" y="204" width="600" height="64" rx="4"/>
  <text class="node" x="60" y="231">ENFORCEMENT</text>
  <text class="cap" x="250" y="231">sits in the call path</text>
  <text class="cap" x="60" y="253">Envoy Gateway, agentgateway, a service mesh</text>
  <rect class="shapeg" x="40" y="278" width="600" height="64" rx="4"/>
  <text class="good" x="60" y="305">BROKERING</text>
  <text class="cap" x="250" y="305">trades a proven identity for a credential</text>
  <text class="cap" x="60" y="327">Agentic Identity Broker, Arcade, Composio</text>
  <rect class="shape" x="40" y="352" width="600" height="64" rx="4"/>
  <text class="node" x="60" y="379">HUMAN IDENTITY</text>
  <text class="cap" x="250" y="379">proves who the person is</text>
  <text class="cap" x="60" y="401">Keycloak, Auth0, Okta, WorkOS, Descope</text>
  <rect class="shape" x="40" y="426" width="600" height="64" rx="4"/>
  <text class="node" x="60" y="453">WORKLOAD IDENTITY</text>
  <text class="cap" x="250" y="453">proves what the agent is</text>
  <text class="cap" x="60" y="475">ServiceAccount tokens, SPIFFE, cloud agent identities</text>
  <path class="ln" d="M656 130 h12 v138 h-12"/>
  <text class="node" x="684" y="195">ENFORCE</text>
  <text class="cap" x="684" y="213">never establish</text>
  <path class="lng" d="M656 278 h12 v212 h-12"/>
  <text class="good" x="684" y="380">ESTABLISH</text>
  <text class="cap" x="684" y="398">who and what</text>
</svg>
