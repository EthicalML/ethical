<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="A shared bot token makes GitHub see one identity for everyone, while per-user delegation through a broker makes it see the real person">
    <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">THE SHARED BOT TOKEN PROBLEM</text>
  <text class="head" x="40" y="86">GitHub sees a bot, <tspan class="headi">or the real person</tspan></text>

  <!-- before -->
  <text class="bad" x="40" y="140">BEFORE &#183; ONE SHARED BOT TOKEN</text>
  <circle class="shape" cx="80" cy="182" r="10"/><path class="shape" d="M64 210 a16 17 0 0 1 32 0"/>
  <text class="node" x="108" y="200">alice</text>
  <circle class="shape" cx="80" cy="252" r="10"/><path class="shape" d="M64 280 a16 17 0 0 1 32 0"/>
  <text class="node" x="108" y="270">bob</text>
  <line class="ln" x1="160" y1="196" x2="258" y2="218" marker-end="url(#ar)"/>
  <line class="ln" x1="160" y1="266" x2="258" y2="234" marker-end="url(#ar)"/>
  <path class="shape" d="M300 190 l32 18 v36 l-32 18 -32-18 v-36 z"/><circle class="shape" cx="300" cy="226" r="7"/>
  <text class="node" x="300" y="284" text-anchor="middle">AGENT</text>
  <line class="lnb" x1="340" y1="226" x2="596" y2="226" marker-end="url(#arb)"/>
  <text class="cap" x="468" y="214" text-anchor="middle">bot token, from a Secret</text>
  <rect class="shapeb" x="600" y="190" width="200" height="72" rx="4"/>
  <text class="bad" x="700" y="220" text-anchor="middle">GITHUB</text>
  <text class="node" x="700" y="242" text-anchor="middle">sees: acme-bot</text>

  <line class="lnd" x1="40" y1="318" x2="820" y2="318"/>

  <!-- after -->
  <text class="good" x="40" y="356">AFTER &#183; PER-USER DELEGATION</text>
  <circle class="shape" cx="80" cy="398" r="10"/><path class="shape" d="M64 426 a16 17 0 0 1 32 0"/>
  <text class="node" x="108" y="416">alice</text>
  <circle class="shape" cx="80" cy="468" r="10"/><path class="shape" d="M64 496 a16 17 0 0 1 32 0"/>
  <text class="node" x="108" y="486">bob</text>
  <line class="ln" x1="160" y1="412" x2="238" y2="434" marker-end="url(#ar)"/>
  <line class="ln" x1="160" y1="482" x2="238" y2="450" marker-end="url(#ar)"/>
  <path class="shape" d="M280 406 l32 18 v36 l-32 18 -32-18 v-36 z"/><circle class="shape" cx="280" cy="442" r="7"/>
  <text class="node" x="280" y="500" text-anchor="middle">AGENT</text>
  <line class="ln" x1="320" y1="442" x2="426" y2="442" marker-end="url(#ar)"/>
  <text class="cap" x="373" y="430" text-anchor="middle">no credential</text>
  <rect class="shape" x="430" y="406" width="130" height="72" rx="4"/>
  <text class="node" x="495" y="438" text-anchor="middle">BROKER</text>
  <text class="cap" x="495" y="458" text-anchor="middle">token vault</text>
  <path class="lng" d="M560 430 C600 430 604 400 638 400" marker-end="url(#arg)"/>
  <path class="lng" d="M560 454 C600 454 604 496 638 496" marker-end="url(#arg)"/>
  <rect class="shapeg" x="642" y="372" width="170" height="56" rx="4"/>
  <text class="good" x="727" y="396" text-anchor="middle">GITHUB</text>
  <text class="node" x="727" y="416" text-anchor="middle">sees: alice</text>
  <rect class="shapeg" x="642" y="468" width="170" height="56" rx="4"/>
  <text class="good" x="727" y="492" text-anchor="middle">GITHUB</text>
  <text class="node" x="727" y="512" text-anchor="middle">sees: bob</text>
  <text class="cap" x="495" y="556" text-anchor="middle">each call goes out with that person's own token</text>
</svg>
