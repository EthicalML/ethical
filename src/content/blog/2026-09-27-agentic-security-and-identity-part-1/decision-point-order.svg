<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The filter order at the gateway, with KAOS's own decision point running before the token exchange">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
      .title{font-family:Georgia,"Times New Roman",serif;font-size:19px;fill:#f2f2f0}
      .dash{fill:none;stroke:#5a5e5a;stroke-width:1.3;stroke-dasharray:5 4}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">DECISION 4 &#183; AUTHORIZATION AS DATA</text>
  <text class="head" x="40" y="86">The decision runs <tspan class="headi">before the exchange</tspan></text>
  <text class="node" x="40" y="254" text-anchor="start">REQUEST</text>
  <line class="ln" x1="104" y1="250" x2="146" y2="250" marker-end="url(#ar)"/>
  <rect class="shape" x="150" y="214" width="150" height="72" rx="4"/>
  <text class="node" x="225" y="242" text-anchor="middle">JWT_AUTHN</text>
  <text class="cap" x="225" y="262" text-anchor="middle">are both</text>
  <text class="cap" x="225" y="278" text-anchor="middle">identities real?</text>
  <line class="ln" x1="300" y1="250" x2="340" y2="250" marker-end="url(#ar)"/>
  <rect class="shapeg" x="344" y="196" width="180" height="108" rx="4"/>
  <text class="good" x="434" y="224" text-anchor="middle">EXT_AUTHZ</text>
  <text class="node" x="434" y="246" text-anchor="middle">our decision point</text>
  <text class="cap" x="434" y="268" text-anchor="middle">stock OPA, grants</text>
  <text class="cap" x="434" y="284" text-anchor="middle">projected by operator</text>
  <path class="lnb" d="M474 196 C474 150 520 148 576 148" marker-end="url(#arb)"/>
  <text class="bad" x="520" y="138" text-anchor="middle">deny</text>
  <rect class="shapeb" x="580" y="126" width="120" height="44" rx="4"/>
  <text class="bad" x="640" y="153" text-anchor="middle">REFUSED</text>
  <line class="lng" x1="524" y1="250" x2="576" y2="250" marker-end="url(#arg)"/>
  <text class="good" x="550" y="240" text-anchor="middle">allow</text>
  <rect class="shape" x="580" y="214" width="140" height="72" rx="4"/>
  <text class="node" x="650" y="242" text-anchor="middle">EXT_PROC</text>
  <text class="cap" x="650" y="262" text-anchor="middle">token exchange,</text>
  <text class="cap" x="650" y="278" text-anchor="middle">egress only</text>
  <line class="ln" x1="720" y1="250" x2="760" y2="250" marker-end="url(#ar)"/>
  <text class="node" x="766" y="254" text-anchor="start">SERVICE</text>
  <line class="lnd" x1="434" y1="304" x2="434" y2="340"/>
  <path class="dash" d="M300 340 h470 v62 h-470 z"/>
  <text class="cap" x="535" y="366" text-anchor="middle">Because the decision runs first, 'allow this request</text>
  <text class="cap" x="535" y="386" text-anchor="middle">but do not exchange a token for it' is expressible</text>
</svg>
