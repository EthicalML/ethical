<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" style="max-width:860px;background-color:transparent" role="img" aria-label="The SDK forwards the identity to the next hop and the gateway makes every decision">
  <defs><style>
      .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#55d68a;letter-spacing:.2em}
      .head{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#f2f2f0}
      .headi{font-family:Georgia,"Times New Roman",serif;font-size:30px;fill:#55d68a;font-style:italic}
      .node{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;fill:#c9c9c6;letter-spacing:.06em}
      .cap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#8a8a86;letter-spacing:.04em}
      .good{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#55d68a;letter-spacing:.05em}
      .bad{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c46a6a;letter-spacing:.05em}
      .ln{stroke:#4a4e4a;stroke-width:1.4;fill:none}
      .lng{stroke:#55d68a;stroke-width:1.6;fill:none}
      .lnb{stroke:#c46a6a;stroke-width:1.4;fill:none}
      .lnd{stroke:#4a4e4a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .shape{fill:none;stroke:#5a5e5a;stroke-width:1.5}
      .shapeg{fill:none;stroke:#55d68a;stroke-width:1.8}
      .shapeb{fill:none;stroke:#c46a6a;stroke-width:1.5}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a4e4a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55d68a"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c46a6a"/></marker>
  </defs>
  <text class="eyebrow" x="40" y="44">DECISION 3 &#183; THE SDK PROPAGATES</text>
  <text class="head" x="40" y="86">The SDK <tspan class="headi">carries</tspan>, the gateway <tspan class="headi">decides</tspan></text>

  <g transform="translate(40,124)">
    <!-- agent with SDK -->
    <rect class="shape" x="0" y="20" width="256" height="96" rx="4"/>
    <text class="node" x="128" y="48" text-anchor="middle">AGENT WRITTEN WITH THE SDK</text>
    <text class="cap" x="128" y="72" text-anchor="middle">forwards user + agent token</text>
    <text class="cap" x="128" y="90" text-anchor="middle">refreshes its own token</text>
    <text class="bad" x="128" y="108" text-anchor="middle">makes no decision</text>

    <!-- agent without SDK -->
    <rect class="shape" x="0" y="160" width="256" height="80" rx="4"/>
    <text class="node" x="128" y="188" text-anchor="middle">AGENT WITHOUT THE SDK</text>
    <text class="cap" x="128" y="212" text-anchor="middle">sends the same tokens by hand</text>
    <text class="cap" x="128" y="230" text-anchor="middle">(less convenient, just as safe)</text>

    <line class="ln" x1="258" y1="68" x2="356" y2="118" marker-end="url(#ar)"/>
    <line class="ln" x1="258" y1="200" x2="356" y2="150" marker-end="url(#ar)"/>

    <!-- gateway -->
    <path class="shapeg" d="M418 76 l52 30 v60 l-52 30 -52-30 V106 z"/>
    <line class="shapeg" x1="418" y1="76" x2="418" y2="196"/>
    <text class="good" x="418" y="222" text-anchor="middle">GATEWAY</text>
    <text class="cap" x="418" y="240" text-anchor="middle">validates both tokens</text>
    <text class="cap" x="418" y="258" text-anchor="middle">asks the decision point</text>

    <line class="lng" x1="472" y1="120" x2="586" y2="90" marker-end="url(#arg)"/>
    <text class="good" x="526" y="88" text-anchor="middle">allow</text>
    <line class="lnb" x1="472" y1="150" x2="586" y2="180" marker-end="url(#arb)"/>
    <text class="bad" x="526" y="186" text-anchor="middle">deny</text>

    <rect class="shapeg" x="592" y="60" width="150" height="56" rx="4"/>
    <text class="good" x="667" y="93" text-anchor="middle">TOOL / MODEL</text>
    <rect class="shapeb" x="592" y="152" width="150" height="56" rx="4"/>
    <text class="bad" x="667" y="185" text-anchor="middle">403</text>
  </g>
</svg>
